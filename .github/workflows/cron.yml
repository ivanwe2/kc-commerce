name: Run a job manually

# MANUAL ONLY. Scheduling runs natively on Cloudflare Cron Triggers now — see
# `triggers.crons` in wrangler.jsonc and the `scheduled` handler in worker.js.
#
# The schedule was deliberately removed rather than kept as a backup: two
# schedulers firing the same jobs would send the daily low-stock digest twice.
# (Back-in-stock and maintenance are idempotent, so those would be harmless —
# the digest is the one that would visibly misbehave.)
#
# This remains as a "run it now" button: useful for testing a job against
# production without waiting for its window, or re-running one after a failure.

on:
  workflow_dispatch:
    inputs:
      schedule:
        description: Which job to run
        required: true
        default: '*/15 * * * *'
        type: choice
        options:
          - '*/15 * * * *'
          - '0 7 * * *'
          - '0 3 * * 0'

jobs:
  run:
    name: Run scheduled job
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call the cron endpoint
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ inputs.schedule }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL variable and CRON_SECRET secret must both be set."
            exit 1
          fi

          echo "Running schedule: $SCHEDULE"

          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --data '' \
            "$SITE_URL/api/cron?schedule=$(printf %s "$SCHEDULE" | jq -sRr @uri)")

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS"
            exit 1
          fi
