name: Scheduled jobs

# Calls the authenticated /api/cron endpoint on a schedule.
#
# This is the scheduler, not a fallback. Cloudflare Cron Triggers cannot be used
# here — the reasoning, including the wrapper approach that was tried and ruled
# out, is recorded in wrangler.jsonc.
#
# GitHub's scheduled runs are best-effort and can be delayed several minutes
# under load. Every job tolerates that: none depend on running at an exact
# moment, and all are safe to run twice.

# Manual runs are always attempted; scheduled runs skip silently until the
# site is configured. See the guard in the step below.

on:
  schedule:
    # Back-in-stock notices — frequent, so a restock feels prompt.
    - cron: '*/15 * * * *'
    # Low-stock digest at 07:00 UTC, before the shop opens in Bulgaria.
    - cron: '0 7 * * *'
    # Weekly maintenance, 03:00 Sunday, when nobody is shopping.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      schedule:
        description: Which job to run
        required: true
        default: '*/15 * * * *'
        type: choice
        options:
          - '*/15 * * * *'
          - '0 7 * * *'
          - '0 3 * * 0'

jobs:
  run:
    name: Run scheduled job
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call the cron endpoint
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ inputs.schedule }}
        run: |
          # Skip cleanly when the site has not been deployed yet.
          #
          # This runs every 15 minutes. Failing while the shop does not exist
          # would email a failure notice four times an hour until launch day,
          # which trains everyone to ignore the notifications that will
          # eventually matter. A missing configuration is not a broken job — it
          # is a job with nothing to talk to.
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipped — NEXT_PUBLIC_SITE_URL and CRON_SECRET are not configured yet."
            echo "Set the NEXT_PUBLIC_SITE_URL repository variable and the CRON_SECRET secret once deployed."
            exit 0
          fi

          echo "Running schedule: $SCHEDULE"

          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --data '' \
            "$SITE_URL/api/cron?schedule=$(printf %s "$SCHEDULE" | jq -sRr @uri)")

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS"
            exit 1
          fi
