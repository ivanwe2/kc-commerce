name: CI

# Lint, typecheck and build on every pull request.
#
# With no test suite by design, this is the only automated gate before merge —
# a PR that does not build cannot land. It needs no Cloudflare credentials:
# payload.config.ts falls back to local Miniflare bindings when
# CLOUDFLARE_API_TOKEN is absent, so forks and untrusted PRs build fine.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare binding types
        # cloudflare-env.d.ts is committed, but regenerating proves it is in
        # sync with wrangler.jsonc rather than a stale artefact.
        run: pnpm exec wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts

      - name: Apply migrations to the local D1 database
        # `next build` runs generateStaticParams, which QUERIES the database for
        # product, category and brand slugs. A fresh CI checkout has an empty
        # Miniflare D1 with no tables, so without this the build fails with
        # "no such table: brands" — nothing to do with Cloudflare credentials.
        env:
          PAYLOAD_SECRET: ci-build-only-secret-not-used-for-signing
        run: pnpm payload migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          # Any 32+ character value: the build only needs the config to validate,
          # never to sign a real token.
          PAYLOAD_SECRET: ci-build-only-secret-not-used-for-signing
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: pnpm build

      - name: Smoke-test the built Worker
        # Building the Worker is not the same as it working. A wrapper around
        # OpenNext's entry once built cleanly and then failed on every request
        # with "handler3 is not a function" — CI was green while the artifact
        # served nothing at all.
        #
        # So: boot the real Worker under wrangler and make it answer. The health
        # route also performs a D1 round-trip, which means this proves the
        # bindings resolve rather than merely that the bundle parses.
        run: |
          # Clean first. `next dev` and `next build` write to the same .next
          # directory, and building the Worker on top of dev output produces an
          # artifact that builds fine and then fails at runtime with
          # "handler3 is not a function". That contamination cost a wrongly
          # diagnosed revert; it is not going to cost a broken deploy.
          rm -rf .next .open-next

          # The Worker reads secrets from .dev.vars, not from the shell. Setting
          # PAYLOAD_SECRET as a step env var does NOT reach it — the Worker boots
          # and every request 500s with "missing secret key". The smoke test
          # caught exactly that, which is the point of having it.
          cat > .dev.vars <<'VARS'
          PAYLOAD_SECRET=ci-smoke-test-secret-not-used-for-signing-anything
          NEXT_PUBLIC_SITE_URL=http://localhost:8787
          VARS
          sed -i 's/^[[:space:]]*//' .dev.vars

          pnpm exec opennextjs-cloudflare build
          pnpm exec wrangler dev --port 8787 --local &
          WORKER_PID=$!

          for i in $(seq 1 45); do
            if curl -sf --max-time 3 http://localhost:8787/api/health > /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 3
          done

          cat /tmp/health.json || true
          echo

          if ! grep -q '"database":"ok"' /tmp/health.json 2>/dev/null; then
            echo "::error::The built Worker did not serve a healthy response."
            kill $WORKER_PID 2>/dev/null || true
            rm -f .dev.vars
            exit 1
          fi

          # A storefront page too — health alone would pass even if rendering
          # were broken.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 http://localhost:8787/)
          echo "GET / -> $STATUS"

          kill $WORKER_PID 2>/dev/null || true
          rm -f .dev.vars

          if [ "$STATUS" != "200" ]; then
            echo "::error::The built Worker did not render the storefront."
            exit 1
          fi

      - name: Check Worker bundle size
        env:
          PAYLOAD_SECRET: ci-build-only-secret-not-used-for-signing
          NEXT_PUBLIC_SITE_URL: https://example.com
        # Measures what wrangler would actually upload, rather than sizing files
        # on disk. See scripts/bundle-size.mjs for why the two obvious
        # alternatives are both wrong.
        run: node scripts/bundle-size.mjs
